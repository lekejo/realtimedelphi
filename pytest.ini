[pytest]
minversion = 6.0
addopts = -ra -q --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:.*marshmallow.*: # Example: ignore specific warnings
    ignore::DeprecationWarning:.*flask_marshmallow.*:
markers =
    slow: marks tests as slow to run
    serial
# Necessary for Flask-Login tests that use `url_for` outside an app context
# if SERVER_NAME is not set in TestingConfig. It's better to set it in config.
# env =
#     FLASK_APP_SERVER_NAME = localhost.localdomain
#     FLASK_APP_APPLICATION_ROOT = /
#     FLASK_APP_PREFERRED_URL_SCHEME = http
# As per https://pytest-flask.readthedocs.io/en/latest/features.html#making-url-for-work-in-tests
# it's better to set SERVER_NAME in app.config['SERVER_NAME'] for testing.
# I will ensure this is in TestingConfig.
# Add --color=yes for colored output if not default
# addopts = --color=yes
# For Flask-SQLAlchemy, ensure tests run in an app context.
# The pytest-flask plugin usually handles this for request contexts.
# For database operations outside requests, conftest.py app_context is key.
